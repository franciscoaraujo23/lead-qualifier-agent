[project]
name = "lead-qualifier"
version = "0.1.0"
description = "Domain-only lead qualification agent: enrichment, LLM scoring, schema-validated output."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
enrich = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "beautifulsoup4>=4.12",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]
anthropic = [
    "anthropic>=0.39",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "dnspython>=2.6",
    "beautifulsoup4>=4.12",
    "fastapi>=0.110",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lead_qualifier"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

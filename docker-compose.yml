# Self-contained stack (architecture.md §5d). `docker compose up` brings up
# Postgres (schema auto-created from migrations/), the FastAPI service, and n8n.
# The Phase 3B workflows live in ./n8n and are mounted into the n8n container,
# so importing them is one command (see README).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lq
      POSTGRES_PASSWORD: lq
      POSTGRES_DB: lead_qualifier
    # Migration runs automatically on first boot.
    volumes:
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lq -d lead_qualifier"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      LQ_PERSISTENCE: postgres
      LQ_DATABASE_URL: postgresql://lq:lq@postgres:5432/lead_qualifier
      LQ_LLM_PROVIDER: ${LQ_LLM_PROVIDER:-mock}
      LQ_LLM_MODEL: ${LQ_LLM_MODEL:-claude-haiku-4-5}
      LQ_ANTHROPIC_API_KEY: ${LQ_ANTHROPIC_API_KEY:-}
      # OpenRouter provider (LQ_LLM_PROVIDER=openrouter). Empty unless set in .env.
      LQ_OPENROUTER_API_KEY: ${LQ_OPENROUTER_API_KEY:-}
      LQ_OPENROUTER_MODEL: ${LQ_OPENROUTER_MODEL:-anthropic/claude-haiku-4.5}
      LQ_WEBHOOK_AUTH_TOKEN: ${LQ_WEBHOOK_AUTH_TOKEN:-}
      LQ_DAILY_COST_CEILING_USD: ${LQ_DAILY_COST_CEILING_USD:-5.0}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    # The image is python-slim (no curl), so probe with the interpreter that is
    # already there. n8n waits on this being healthy before it starts.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    # Pinned, not :latest — a floating tag can ship a node version that rejects
    # the imported workflow on a fresh `docker compose up`. 2.39.7 is the version
    # this stack was verified against.
    image: n8nio/n8n:2.39.7
    environment:
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Europe/Lisbon
      # Nothing LQ_* is passed in on purpose. n8n task runners sandbox Code nodes
      # and deny env access, so a workflow that reads $env only runs on a host
      # configured to allow it. The workflow carries its own Config node instead,
      # and its two secrets are credentials. See architecture.md §9.6.
    ports:
      - "5678:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      # Workflow JSON mounted read-only for `n8n import:workflow`.
      - ./n8n:/workflows:ro
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  n8ndata:
